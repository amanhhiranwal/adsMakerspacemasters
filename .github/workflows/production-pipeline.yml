name: Nexus-20 Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  # ============================================================
  # CI - Build & Validate
  # ============================================================
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install Dependencies
        run: npm ci

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build Next.js Application
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}

          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}

        run: npm run build


  # ============================================================
  # CD - Deploy
  # ============================================================
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts


      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------
      - name: Deploy Application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}

        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" << 'EOF'

            set -e

            echo "========================================"
            echo "Starting production deployment"
            echo "========================================"

            cd /var/www/adsMakerspacemasters

            echo "----------------------------------------"
            echo "Pulling latest main branch"
            echo "----------------------------------------"

            git fetch origin

            git reset --hard origin/main

            echo "----------------------------------------"
            echo "Installing dependencies"
            echo "----------------------------------------"

            npm ci

            echo "----------------------------------------"
            echo "Creating production .env"
            echo "----------------------------------------"

            cat > .env << 'ENVEOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_SSLMODE=${{ secrets.DB_SSLMODE }}

          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET=${{ secrets.ADMIN_SESSION_SECRET }}
          ENVEOF

            chmod 600 .env

            echo "----------------------------------------"
            echo "Building Next.js application"
            echo "----------------------------------------"

            npm run build

            echo "----------------------------------------"
            echo "Restarting PM2"
            echo "----------------------------------------"

            if pm2 describe ads > /dev/null 2>&1; then
              pm2 restart ads
            else
              pm2 start npm --name ads -- start
            fi

            pm2 save

            echo "----------------------------------------"
            echo "Checking application"
            echo "----------------------------------------"

            sleep 5

            if curl -f http://localhost:3008 > /dev/null 2>&1; then
              echo "Application is running successfully on port 3008"
            else
              echo "Application health check failed"
              pm2 logs ads --lines 50 --nostream
              exit 1
            fi

            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"

          EOF
